<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillVerse - Admin Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3 sticky-top glass-nav">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">
                <i class="bi bi-rocket-takeoff-fill me-2 text-gradient"></i>SkillVerse Admin
            </a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn lang-btn" id="langToggleBtn" onclick="toggleLanguage()">🌐 EN</button>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="logout">ออกจากระบบ</span></button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-4">
                    <h3 class="fw-bold text-warning mb-3"><i class="bi bi-shield-lock-fill me-2"></i>แผงควบคุมผู้ดูแลระบบ (Admin Panel)</h3>
                    <p class="text-sub small mb-4">แก้ไขและจัดการข้อมูลส่วนตัวที่แสดงบนหน้าแรกของระบบ</p>

                    <form id="editProfileForm" onsubmit="handleSaveProfile(event)">
                        <div class="mb-3">
                            <label class="form-label text-sub">ชื่อ - นามสกุล</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="inputName" required>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label text-sub">รหัสนักศึกษา</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" id="inputId" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label text-sub">หมู่เรียน</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" id="inputGroup" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label text-sub">รายวิชา</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" id="inputSubject" value="การออกแบบและพัฒนาเว็บไซต์เบื้องต้น" readonly>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-sub">สถานะประเมิน</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="inputStatus" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="index.html" class="btn btn-outline-light rounded-pill px-4">กลับหน้าหลัก</a>
                            <button type="submit" class="btn btn-custom rounded-pill px-4">บันทึกข้อมูล</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('skillverse_role') !== 'admin') {
                alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้!');
                window.location.href = 'index.html';
                return;
            }
            const user = getCurrentUserSession();
            if (user) {
                document.getElementById('inputName').value = user.name;
                document.getElementById('inputId').value = user.studentId;
                document.getElementById('inputGroup').value = user.group;
                document.getElementById('inputSubject').value = "การออกแบบและพัฒนาเว็บไซต์เบื้องต้น";
                document.getElementById('inputStatus').value = user.status || 'ประเมินเรียบร้อย';
            }
        });

        function handleSaveProfile(event) {
            event.preventDefault();
            const user = getCurrentUserSession();
            if (!user) return;

            user.name = document.getElementById('inputName').value;
            user.studentId = document.getElementById('inputId').value;
            user.group = document.getElementById('inputGroup').value;
            user.subject = "การออกแบบและพัฒนาเว็บไซต์เบื้องต้น";
            user.status = document.getElementById('inputStatus').value;

            localStorage.setItem('skillverse_user', JSON.stringify(user));

            let users = JSON.parse(localStorage.getItem('sv_users_db')) || [];
            const index = users.findIndex(u => u.studentId === user.studentId || u.name === user.name);
            if (index !== -1) {
                users[index] = user;
                localStorage.setItem('sv_users_db', JSON.stringify(users));
            }

            alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
