<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillVerse - Login & Register Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <i class="bi bi-rocket-takeoff-fill fs-1 text-gradient"></i>
                        <h3 class="fw-bold mt-2 text-gradient">SkillVerse Portal</h3>
                        <p class="text-sub small">ระบบประเมินทักษะและจัดการการเรียนรู้ไอที</p>
                    </div>

                    <!-- Tabs เลือกสถานะการเข้าสู่ระบบ หรือ สมัครสมาชิก -->
                    <ul class="nav nav-pills nav-justified mb-4 p-1 rounded-pill bg-dark bg-opacity-50 border border-secondary border-opacity-25" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill text-white small fw-bold" id="student-login-tab" data-bs-toggle="pill" data-bs-target="#student-login-panel" type="button" role="tab">
                                <i class="bi bi-person-fill me-1"></i> นักศึกษา
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill text-white small fw-bold" id="admin-login-tab" data-bs-toggle="pill" data-bs-target="#admin-login-panel" type="button" role="tab">
                                <i class="bi bi-shield-lock-fill me-1"></i> แอดมิน / อาจารย์
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill text-white small fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button" role="tab">
                                <i class="bi bi-person-plus-fill me-1"></i> สมัครสมาชิก
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabContent">
                        
                        <!-- 1. แผงเข้าสู่ระบบ: นักศึกษา -->
                        <div class="tab-pane fade show active" id="student-login-panel" role="tabpanel">
                            <form onsubmit="handleLogin(event, 'user')">
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-card-heading me-1"></i>รหัสนักศึกษา</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="studentLoginId" placeholder="เช่น 6840144204" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-sub small"><i class="bi bi-lock-fill me-1"></i>รหัสผ่าน</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="studentLoginPassword" placeholder="กรอกรหัสผ่าน" required>
                                </div>
                                <button type="submit" class="btn btn-custom w-100 py-2 fw-bold rounded-3">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบนักศึกษา
                                </button>
                            </form>
                            <div class="mt-3 text-center text-sub small">
                                นักศึกษาใหม่? คลิกที่แท็บ <strong>"สมัครสมาชิก"</strong> ด้านบน
                            </div>
                        </div>

                        <!-- 2. แผงเข้าสู่ระบบ: แอดมิน / อาจารย์ -->
                        <div class="tab-pane fade" id="admin-login-panel" role="tabpanel">
                            <form onsubmit="handleLogin(event, 'admin')">
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-person-badge-fill me-1"></i>ชื่อผู้ใช้งานแอดมิน (Username)</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="adminUsername" placeholder="เช่น admin" value="6840144204" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-sub small"><i class="bi bi-key-fill me-1"></i>รหัสผ่านผู้ดูแลระบบ</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="adminPassword" placeholder="กรอกรหัสผ่านแอดมิน" value="1234" required>
                                </div>
                                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold rounded-3 text-dark">
                                    <i class="bi bi-shield-fill-check me-1"></i> เข้าสู่ระบบแอดมิน (Admin Portal)
                                </button>
                            </form>
                            <div class="mt-3 text-center text-sub small">
                                🔒 สำหรับอาจารย์ผู้สอนหรือผู้ดูแลระบบหลังบ้านเท่านั้น
                            </div>
                        </div>

                        <!-- 3. แผงสมัครสมาชิก (เพิ่มยืนยันรหัสผ่าน + PIN 6 หลัก) -->
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-card-heading me-1"></i>รหัสนักศึกษา</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="regStudentId" placeholder="เช่น 6840144205" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-person-fill me-1"></i>ชื่อ - นามสกุล</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="regName" placeholder="เช่น นายสมชาย สายโค้ด" required>
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label class="form-label text-sub small">หมู่เรียน</label>
                                        <input type="text" class="form-control bg-dark text-white border-secondary" id="regGroup" placeholder="ว.6501" required>
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label class="form-label text-sub small">รายวิชา</label>
                                        <input type="text" class="form-control bg-dark text-white border-secondary" id="regSubject" value="การออกแบบและพัฒนาเว็บไซต์เบื้องต้น" readonly>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-key-fill me-1"></i>ตั้งรหัสผ่าน</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="regPassword" placeholder="อย่างน้อย 4 ตัวอักษร" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-sub small"><i class="bi bi-shield-lock-fill me-1"></i>ยืนยันรหัสผ่านอีกครั้ง</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary" id="regConfirmPassword" placeholder="กรอกรหัสผ่านให้ตรงกัน" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-sub small"><i class="bi bi-123 me-1"></i>ตั้งรหัส PIN ความปลอดภัย (6 หลัก)</label>
                                    <input type="password" class="form-control bg-dark text-white border-secondary text-center fs-5 tracking-widest" id="regPin" maxlength="6" pattern="[0-9]{6}" placeholder="------" required title="กรุณากรอกรหัส PIN เป็นตัวเลข 6 หลัก">
                                    <div class="form-text text-sub" style="font-size: 0.75rem;">ใช้สำหรับยืนยันความปลอดภัยในระบบ (ตัวเลข 6 หลัก)</div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3">
                                    <i class="bi bi-person-plus-fill me-1"></i> ยืนยันการสมัครสมาชิกนักศึกษา
                                </button>
                            </form>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        function handleLogin(event, roleType) {
            event.preventDefault();
            let idOrUser, password;

            if (roleType === 'admin') {
                idOrUser = document.getElementById('adminUsername').value.trim();
                password = document.getElementById('adminPassword').value.trim();
            } else {
                idOrUser = document.getElementById('studentLoginId').value.trim();
                password = document.getElementById('studentLoginPassword').value.trim();
            }

            let users = JSON.parse(localStorage.getItem('sv_users_db')) || [];
            let foundUser = users.find(u => (u.studentId === idOrUser || u.name === idOrUser) && u.password === password);

            if (foundUser) {
                if (roleType === 'admin' && foundUser.role !== 'admin') {
                    alert('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งานในฐานะแอดมิน!');
                    return;
                }

                localStorage.setItem('skillverse_user', JSON.stringify(foundUser));
                localStorage.setItem('skillverse_role', roleType === 'admin' ? 'admin' : (foundUser.role || 'user'));
                
                alert(`ยินดีต้อนรับคุณ ${foundUser.name} (${roleType === 'admin' ? 'Admin' : 'Student'})`);
                
                if (roleType === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                alert('ข้อมูลเข้าสู่ระบบไม่ถูกต้อง หรือไม่พบชื่อผู้ใช้งานนี้ในระบบ!');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const studentId = document.getElementById('regStudentId').value.trim();
            const name = document.getElementById('regName').value.trim();
            const group = document.getElementById('regGroup').value.trim();
            const subject = "การออกแบบและพัฒนาเว็บไซต์เบื้องต้น";
            const password = document.getElementById('regPassword').value.trim();
            const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            const pin = document.getElementById('regPin').value.trim();

            // ตรวจสอบว่ารหัสผ่านตรงกันไหม
            if (password !== confirmPassword) {
                alert('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง!');
                return;
            }

            // ตรวจสอบ PIN 6 หลัก
            if (pin.length !== 6 || isNaN(pin)) {
                alert('รหัส PIN ความปลอดภัยต้องเป็นตัวเลข 6 หลักเท่านั้น!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('sv_users_db')) || [];

            if (users.some(u => u.studentId === studentId)) {
                alert('รหัสนักศึกษานี้มีในระบบแล้ว กรุณาเข้าสู่ระบบ!');
                return;
            }

            const newUser = {
                studentId: studentId,
                name: name,
                group: group,
                subject: subject,
                password: password,
                pin: pin,
                status: 'ประเมินเรียบร้อย',
                role: 'user',
                lastScore: 0
            };

            users.push(newUser);
            localStorage.setItem('sv_users_db', JSON.stringify(users));

            alert('สมัครสมาชิกนักศึกษาสำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสนักศึกษาและรหัสผ่านของคุณ');
            const studentTab = new bootstrap.Tab(document.getElementById('student-login-tab'));
            studentTab.show();
            document.getElementById('studentLoginId').value = studentId;
        }
    </script>
</body>
</html>
